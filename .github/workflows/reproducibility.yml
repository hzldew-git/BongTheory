name: Release reproducibility

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch, tag, or full commit to reproduce
        required: false
        default: ''
        type: string
      runner:
        description: Runner selection
        required: true
        default: both
        type: choice
        options:
          - both
          - ubuntu-latest
          - windows-latest
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  clean-clone-build:
    name: Clean clone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner != 'both' && format('["{0}"]', inputs.runner) || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      # Two workers stay within the memory envelope used by the per-paper
      # clean builds while keeping the enlarged public closure below the
      # six-hour Ubuntu and Windows job deadline.
      LEAN_NUM_THREADS: '2'

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.sha }}

      - name: Discover the deployable release surface
        id: modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entryModules = @()
          $auditModules = @('BongTest.FinalPublicTheoremAudit')
          foreach ($directory in Get-ChildItem -LiteralPath papers -Directory) {
            $path = Join-Path $directory.FullName 'paper.json'
            if (-not (Test-Path -LiteralPath $path)) {
              continue
            }
            $manifest = Get-Content -LiteralPath $path -Raw |
              ConvertFrom-Json
            if ($manifest.deployment.githubReviewKit -eq $false) {
              continue
            }
            $entryModules += [string] $manifest.entryModule
            $auditModules += @($manifest.auditModules | ForEach-Object {
              [string] $_
            })
          }
          $buildModules = @($entryModules + $auditModules |
            Where-Object { $_ } | Sort-Object -Unique)
          $auditPaths = @($auditModules | Where-Object { $_ } |
            Sort-Object -Unique | ForEach-Object {
              $_.Replace('.', '/') + '.lean'
            })
          if ($buildModules.Count -eq 0 -or $auditPaths.Count -eq 0) {
            throw 'No deployable release modules were discovered.'
          }
          "buildModules=$($buildModules -join ' ')" >> $env:GITHUB_OUTPUT
          "auditPaths=$($auditPaths -join ' ')" >> $env:GITHUB_OUTPUT

      - name: Build without a GitHub project cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          build: true
          build-args: ${{ steps.modules.outputs.buildModules }}
          use-github-cache: false
          use-mathlib-cache: true

      - name: Run paper-specific audit modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lakeCommand = Get-Command lake -ErrorAction SilentlyContinue
          $lake = if ($lakeCommand) { $lakeCommand.Source } else { $null }
          if (-not $lake) {
            $runnerHome = if ($env:USERPROFILE) {
              $env:USERPROFILE
            } elseif ($env:HOME) {
              $env:HOME
            } else {
              throw 'Neither USERPROFILE nor HOME identifies the runner home directory.'
            }
            $lakeName = if ($IsWindows) { 'lake.exe' } else { 'lake' }
            $lake = Join-Path (Join-Path $runnerHome '.elan/bin') $lakeName
          }
          if (-not (Test-Path -LiteralPath $lake)) {
            throw "Lean action did not install Lake at the expected path: $lake"
          }
          $auditDir = Join-Path $env:RUNNER_TEMP 'bong-audit-logs'
          New-Item -ItemType Directory -Force -Path $auditDir | Out-Null
          $modules = '${{ steps.modules.outputs.auditPaths }}' -split ' '
          foreach ($module in $modules) {
            $name = [IO.Path]::GetFileNameWithoutExtension($module)
            $log = Join-Path $auditDir ($name + '.log')
            & $lake env lean $module *> $log
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log -Tail 200
              exit $LASTEXITCODE
            }
          }

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/bong-audit-logs/*.log
          if-no-files-found: error

      - name: Verify exact clean worktree
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            $status
            throw 'The checked revision modified tracked or untracked project files.'
          }
