name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test and run the comment-aware unfinished-proof check
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
          python3 -B scripts/ci/check_lean_proof_commands.py

      - name: Plan complete Lean source coverage
        id: shards
        shell: bash
        run: >-
          python3 -B scripts/ci/plan_lean_build_shards.py
          --production-shards 48 --test-shards 24
          --github-output "$GITHUB_OUTPUT"

  build-and-audit:
    needs: plan
    name: Build and audit ${{ matrix.shard.name }} (${{ matrix.shard.moduleCount }} modules)
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Two workers avoid the default high parallelism that triggered runner
      # memory faults.  Forty-eight production shards keep the complete-source
      # coverage jobs below GitHub's six-hour deadline even for the largest
      # Beli 2019 dependency closures.
      LEAN_NUM_THREADS: '2'

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build every module in this shard
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          build-args: ${{ matrix.shard.buildModules }}
          use-mathlib-cache: true

      - name: Enforce transitive axiom bounds on production shards
        if: ${{ matrix.shard.axiomGate }}
        shell: pwsh
        env:
          SHARD_MODULES: ${{ matrix.shard.modules }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('scripts/ci/run_axiom_gate.py')
          foreach ($module in ($env:SHARD_MODULES -split ' ')) {
            if ($module) {
              $arguments += '--entry'
              $arguments += $module
            }
          }
          python3 -B @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify clean generated state
        shell: bash
        run: test -z "$(git status --porcelain)"

  axiom-gate-fixtures:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '1'

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Negatively test the enforcing gate
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          build-args: BongTest.AxiomGate
          use-mathlib-cache: true

      - name: Run actual positive and negative fixtures
        shell: bash
        run: python3 -B scripts/ci/check_axiom_gate_fixtures.py
