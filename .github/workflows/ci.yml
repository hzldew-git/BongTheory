name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test and run the comment-aware unfinished-proof check
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
          python3 -B scripts/ci/check_lean_proof_commands.py

      - name: Build and audit the complete Bong namespace
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: Bong
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Check public theorem signatures and axiom sets
        run: lake env lean BongTest/FinalPublicTheoremAudit.lean

      - name: Verify clean generated state
        shell: bash
        run: test -z "$(git status --porcelain)"
