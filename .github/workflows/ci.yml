name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and audit the complete Bong namespace
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: Bong
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Reject unfinished proof commands
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '(^|[^[:alpha:]])sorry([^[:alpha:]]|$)|sorryAx|^[[:space:]]*axiom[[:space:]]' -- '*.lean'; then
            echo 'Forbidden unfinished proof or project axiom found.' >&2
            exit 1
          fi

      - name: Check public theorem signatures and axiom sets
        run: lake env lean BongTest/FinalPublicTheoremAudit.lean

      - name: Verify clean generated state
        shell: bash
        run: test -z "$(git status --porcelain)"
